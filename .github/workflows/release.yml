# Release — promote changelog and publish GitHub Release
#
# Project-specific build and Docker steps are not applicable: this repository
# generates CMake projects under templates/*/files/ rather than at its root.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      version: ${{ inputs.version || 'auto' }}
    permissions:
      contents: write
      actions: write
