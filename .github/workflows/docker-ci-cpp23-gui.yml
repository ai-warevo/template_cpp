name: Build & Push CI Docker GUI Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-gui-variants:
    name: Build GUI ${{ matrix.variant }} Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [gcc-15, clang-18-libstdc, clang-18-libcxx]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.variant }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ai-warevo/ci-cpp23-gui
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ matrix.variant == 'gcc-15' }}

      - name: Build and push GUI ${{ matrix.variant }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gui.${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify GUI ${{ matrix.variant }} Image
    needs: build-gui-variants
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [gcc-15, clang-18-libstdc, clang-18-libcxx]
    steps:
      - name: Verify ${{ matrix.variant }} GUI image
        run: |
          echo "=== GUI ${{ matrix.variant }} ===" 
          docker run --rm ghcr.io/ai-warevo/ci-cpp23-gui:${{ matrix.variant }} cmake --version | head -1
          docker run --rm ghcr.io/ai-warevo/ci-cpp23-gui:${{ matrix.variant }} ninja --version
          echo "=== GLFW ===" 
          docker run --rm ghcr.io/ai-warevo/ci-cpp23-gui:${{ matrix.variant }} ls /opt/deps/*/lib/pkgconfig/glfw* 2>/dev/null || echo "GLFW found in variant"
          echo "=== Xvfb ===" 
          docker run --rm ghcr.io/ai-warevo/ci-cpp23-gui:${{ matrix.variant }} which Xvfb
