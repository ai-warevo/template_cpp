name: on_wfd__docker_build_cpp23

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for base
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ai-warevo/ci-cpp23
          tags: |
            type=raw,value=base

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-variants:
    name: Build ${{ matrix.variant }} Image
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [gcc-15, clang-18-libstdc, clang-18-libcxx]
    steps:
      - uses: actions/checkout@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.variant }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ai-warevo/ci-cpp23
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ inputs.tag }},enable=${{ matrix.variant == 'gcc-15' }}

      - name: Build and push ${{ matrix.variant }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          build-args: |
            BASE_IMAGE=ghcr.io/ai-warevo/ci-cpp23:base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify Toolchain Versions
    needs: build-variants
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [gcc-15, clang-18-libstdc, clang-18-libcxx]
    steps:
      - name: Verify ${{ matrix.variant }}
        run: |
          echo "=== ${{ matrix.variant }} ==="
          docker run --rm ghcr.io/ai-warevo/ci-cpp23:${{ matrix.variant }} cmake --version | head -1
          docker run --rm ghcr.io/ai-warevo/ci-cpp23:${{ matrix.variant }} ninja --version
