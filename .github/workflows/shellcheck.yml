# ShellCheck — lint generator scripts
#
# Lints the Bash scripts of the template generator.
# Runs on ubuntu-latest (native runner, needs apt-get).

name: ShellCheck

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Lint generator scripts
        run: shellcheck templates/*.sh
