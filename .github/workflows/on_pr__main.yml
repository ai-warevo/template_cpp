name: on_pr__main

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # FAST-CHECKS — lint + build on PR
  # ────────────────────────────────────────────────────────────
  fast-checks:
    uses: ai-warevo/.github/.github/workflows/reusable-pr-fast.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      build_type: Debug
      extra_args: -DCI_CHECK_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      extensions: cpp,hpp,c,h
      container_image: ghcr.io/ai-warevo/ci-cpp23
      setup_command: mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project

  # ────────────────────────────────────────────────────────────
  # UNIT-TESTS — matrix unit tests on PR
  # ────────────────────────────────────────────────────────────
  unit-tests:
    uses: ai-warevo/.github/.github/workflows/reusable-matrix.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      enable_windows: false
      cmake_extra_args_linux: >-
        -DCI_CHECK_BUILD_TESTS=ON
      ctest_timeout: 120
      setup_command: >-
        mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project

  # ────────────────────────────────────────────────────────────
  # DISCOVER — find all templates for selftest
  # ────────────────────────────────────────────────────────────
  discover:
    name: Discover Templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find.outputs.templates }}
    steps:
      - uses: actions/checkout@main
      - id: find
        shell: bash
        run: |
          list=$(bash templates/scaffold.sh list | grep -v '(internal:' | grep -v '^  gui ' | sed -n 's/^  \([^ ]*\) .*/"\1"/p' | paste -sd, -)
          echo "templates=[$list]" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────
  # TEMPLATE-CI — each template: scaffold + build + test + lint
  # ────────────────────────────────────────────────────────────
  template-ci:
    name: Template — ${{ matrix.template }}
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23-gui
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@main

      # 1. Selftest (scaffold + GCC Debug + CTest + Xvfb for gui)
      - name: Start Xvfb for headless GUI testing
        run: Xvfb :99 -screen 0 1024x768x24 &

      - name: Selftest
        env:
          DISPLAY: :99
          RUN_GUI_TESTS: "1"
        run: bash templates/selftest.sh "${{ matrix.template }}"

      # 2. Scaffold template into workspace & eject templates/
      - name: Scaffold template
        run: |
          AW_FORCE_ROOT=1 bash templates/scaffold.sh init "${{ matrix.template }}" --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      # 3. clang-format check
      - name: clang-format check
        uses: ai-warevo/.github/.github/actions-legacy/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp

      # 4. Build & Test (Clang + ASan/UBSan + compile_commands)
      - name: Setup toolchain (Clang + sanitizers)
        id: tc
        uses: ai-warevo/.github/.github/actions-legacy/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true
          sanitizer: address

      - name: Configure & Build (Clang + ASan/UBSan)
        env:
          DISPLAY: :99
        uses: ai-warevo/.github/.github/actions-legacy/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

      - name: Run Tests (Clang + ASan/UBSan)
        env:
          DISPLAY: :99
        uses: ai-warevo/.github/.github/actions-legacy/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: RelWithDebInfo
          output_on_failure: true

      # 5. clang-tidy
      - name: clang-tidy
        uses: ai-warevo/.github/.github/actions-legacy/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          header_filter: '.*/(include|src)/.*'

  # ────────────────────────────────────────────────────────────
  # TSan — test with ThreadSanitizer (GCC, host ASLR required)
  # ────────────────────────────────────────────────────────────
  template-tsan:
    name: Template TSan — ${{ matrix.template }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@main

      - name: Scaffold template
        shell: bash
        run: |
          AW_FORCE_ROOT=1 bash templates/scaffold.sh init "${{ matrix.template }}" --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      - name: Configure ThreadSanitizer
        id: tsan
        uses: ai-warevo/.github/.github/actions-legacy/setup-tsan@main
        with:
          toolchain: gcc15
          container_mode: false

      - name: Setup toolchain (GCC + TSan)
        id: tc
        uses: ai-warevo/.github/.github/actions-legacy/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: false
          sanitizer: thread

      - name: Configure & Build (GCC + TSan)
        uses: ai-warevo/.github/.github/actions-legacy/cmake-build@main
        with:
          source_dir: .
          build_dir: build-tsan
          build_type: RelWithDebInfo
          extra_args: "${{ steps.tsan.outputs.stdlib_override }} ${{ steps.tc.outputs.cmake_args }}"
          parallel: false

      - name: Run Tests (GCC + TSan)
        uses: ai-warevo/.github/.github/actions-legacy/ctest-run@main
        with:
          source_dir: .
          build_dir: build-tsan
          config: RelWithDebInfo
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # WINDOWS-MSVC — template generation check on Windows
  # ────────────────────────────────────────────────────────────
  windows-msvc:
    name: Windows MSVC (all templates)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run selftest on MSVC
        shell: bash
        run: bash templates/selftest.sh
