# Test (container) — C++20 Container Test + Coverage + Badge
#
# Uses a CI container image (ghcr.io/ai-warevo/ci-cpp23) and composite
# actions from ai-warevo/.github/.github/actions/.
#
# To override container image: fork this file and replace the image value
# (GitHub Actions does not support env.* in container.image context).
#
# Linux-jobs: test matrix + sanitizers + coverage + badge
# MSVC-jobs: test on native windows-latest

name: Test (container)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # TEST — Linux (container) — sanitizer matrix
  # ────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.toolchain }} / ${{ matrix.build_type }} / ${{ matrix.sanitizer || 'none' }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - clang18-libcxx
          - gcc15
        build_type:
          - Debug
        include:
          # clang-18 libc++ with ASan
          - toolchain: clang18-libcxx
            build_type: RelWithDebInfo
            sanitizer: address
          # clang-18 libstdc++ with TSan (TSan requires libstdc++)
          - toolchain: clang18-libstdcxx
            build_type: RelWithDebInfo
            sanitizer: thread
          # gcc-15 with UBSan
          - toolchain: gcc15
            build_type: RelWithDebInfo
            sanitizer: undefined

    steps:
      - uses: actions/checkout@main

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true
          sanitizer: ${{ matrix.sanitizer || '' }}

      - name: Scaffold project
        run: bash templates/scaffold.sh init static --name ci_check --ns aw::ci

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # TEST — Windows (MSVC native runner)
  # ────────────────────────────────────────────────────────────
  test-windows:
    name: Test Windows (MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@main

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Scaffold project
        shell: bash
        run: bash templates/scaffold.sh init static --name ci_check --ns aw::ci

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: "${{ steps.tc.outputs.cmake_args }}"

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # COVERAGE — gcovr report (gcc-15 + libstdc++)
  # ────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@main

      - name: Scaffold project
        run: bash templates/scaffold.sh init static --name ci_check --ns aw::ci

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: true

      # Build with coverage flags
      - name: Configure with coverage
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON '-DCMAKE_CXX_FLAGS=-fprofile-arcs -ftest-coverage' '-DCMAKE_EXE_LINKER_FLAGS=-lgcov'"

      - name: Run Tests (coverage)
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug
          output_on_failure: true

      - name: Generate Coverage Report
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        id: gcovr
        with:
          source_dir: .
          build_dir: build
          source_filter: 'src/ include/'
          exclude: '_deps/*'
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@main
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload coverage HTML
        uses: actions/upload-artifact@main
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # BADGE — coverage badge generation + deploy
  # ────────────────────────────────────────────────────────────
  badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    needs: coverage
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@main

      - name: Download coverage XML
        uses: actions/download-artifact@main
        with:
          name: coverage-xml

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/.github/actions/coverage-parser@main

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}%'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        if: hashFiles('htmlcov/index.html') != ''
        uses: ai-warevo/.github/.github/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
