# PR Test — fast unit tests on generated project
#
# Triggers: pull_request and push to main/master
# Calls: reusable-matrix.yml from ai-warevo/.github
#
# This workflow runs a fast Debug unit test suite on the generated CI project
# across the primary toolchains (clang-18/libc++ and gcc-15).

name: PR Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ai-warevo/.github/.github/workflows/reusable-matrix.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      linux_toolchains: '["clang18-libcxx", "gcc15"]'
      build_types: '["Debug"]'
      enable_windows: false
      cmake_extra_args_linux: >-
        -DCI_CHECK_BUILD_TESTS=ON
      ctest_timeout: 120
      setup_command: >-
        mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project
