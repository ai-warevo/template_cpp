# Selftest — generate all templates, build, test, sanitizers
#
# Runs selftest.sh for each template, checks clang-format,
# clang-tidy, ASan/UBSan (Clang), TSan (GCC).
#
# To override container image: fork this file and replace the image value
# (GitHub Actions does not support env.* in container.image context).

name: Selftest

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # DISCOVER — find all templates
  # ────────────────────────────────────────────────────────────
  discover:
    name: Discover Templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find.outputs.templates }}
    steps:
      - uses: actions/checkout@main
      - id: find
        shell: bash
        run: |
          list=$(bash templates/scaffold.sh list | grep -v '(internal:' | grep -v '^  gui ' | sed -n 's/^  \([^ ]*\) .*/"\1"/p' | paste -sd, -)
          echo "templates=[$list]" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────
  # TEMPLATE-CI — each template: scaffold + build + test + lint
  # ────────────────────────────────────────────────────────────
  template-ci:
    name: Template — ${{ matrix.template }}
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23-gui
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@main

      # 1. Selftest (scaffold + GCC Debug + CTest + Xvfb for gui)
      - name: Start Xvfb for headless GUI testing
        run: Xvfb :99 -screen 0 1024x768x24 &

      - name: Selftest
        env:
          DISPLAY: :99
          RUN_GUI_TESTS: "1"
        run: bash templates/selftest.sh "${{ matrix.template }}"

      # 2. Scaffold template into workspace & eject templates/
      - name: Scaffold template
        run: |
          AW_FORCE_ROOT=1 bash templates/scaffold.sh init "${{ matrix.template }}" --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      # 3. clang-format check
      - name: clang-format check
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp

      # 4. Build & Test (Clang + ASan/UBSan + compile_commands)
      - name: Setup toolchain (Clang + sanitizers)
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true
          sanitizer: address

      - name: Configure & Build (Clang + ASan/UBSan)
        env:
          DISPLAY: :99
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

      - name: Run Tests (Clang + ASan/UBSan)
        env:
          DISPLAY: :99
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: RelWithDebInfo
          output_on_failure: true

      # 5. clang-tidy
      - name: clang-tidy
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          header_filter: '.*/(include|src)/.*'

  # ────────────────────────────────────────────────────────────
  # TSan — test with ThreadSanitizer (GCC, host ASLR required)
  # ────────────────────────────────────────────────────────────
  template-tsan:
    name: Template TSan — ${{ matrix.template }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@main

      - name: Scaffold template
        shell: bash
        run: |
          AW_FORCE_ROOT=1 bash templates/scaffold.sh init "${{ matrix.template }}" --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      - name: Configure ThreadSanitizer
        id: tsan
        uses: ai-warevo/.github/.github/actions/setup-tsan@main
        with:
          toolchain: gcc15
          container_mode: false

      - name: Setup toolchain (GCC + TSan)
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: false
          sanitizer: thread

      - name: Configure & Build (GCC + TSan)
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build-tsan
          build_type: RelWithDebInfo
          extra_args: "${{ steps.tsan.outputs.stdlib_override }} ${{ steps.tc.outputs.cmake_args }}"
          parallel: false

      - name: Run Tests (GCC + TSan)
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build-tsan
          config: RelWithDebInfo
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # WINDOWS-MSVC — template generation check on Windows
  # ────────────────────────────────────────────────────────────
  windows-msvc:
    name: Windows MSVC (all templates)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run selftest on MSVC (skip extras)
        shell: bash
        env:
          SKIP_TEMPLATE_EXTRAS: "1"
        run: bash templates/selftest.sh
