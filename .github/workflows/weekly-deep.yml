# Weekly Deep — sanitizers + coverage (scheduled + manual)
#
# Triggers: scheduled weekly on Monday 00:00 UTC, or manual (workflow_dispatch)
# Calls: reusable-sanitizers.yml, reusable-coverage-badge.yml from ai-warevo/.github
#
# This workflow runs the comprehensive test suite on the generated CI project:
#   - Setup: generate .ci-project from template
#   - ASan + UBSan (full test suite in container)
#   - TSan (full test suite on host)
#   - Coverage (gcovr → badge → GitHub Pages)

name: Weekly Deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:  # allow manual trigger for testing

permissions:
  contents: write
  packages: write

jobs:
  sanitizers:
    uses: ai-warevo/.github/.github/workflows/reusable-sanitizers.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23:clang-18-libcxx
      cmake_sanitize_var: CI_CHECK_SANITIZE
      cmake_extra_args: '-DCI_CHECK_BUILD_TESTS=ON'
      ctest_timeout: 300
      tsan_repeat_count: 1
      tsan_test_regex: ''
      asan_options: 'detect_leaks=1:halt_on_error=1'
      tsan_options: 'halt_on_error=1:second_deadlock_stack=1'
      setup_command: >-
        mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project

  coverage:
    uses: ai-warevo/.github/.github/workflows/reusable-coverage-badge.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      toolchain: gcc15
      cmake_extra_args: '-DCI_CHECK_BUILD_TESTS=ON -DAW_ENABLE_COVERAGE=ON'
      gcovr_source_filter: 'include src examples'
      gcovr_exclude: '_deps/*'
      setup_command: 'mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project'
