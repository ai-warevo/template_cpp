name: on_wfd__release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ────────────────────────────────────────────────────────────
  # RESOLVE-VERSION — read version from VERSION file
  # ────────────────────────────────────────────────────────────
  resolve-version:
    uses: ai-warevo/.github/.github/workflows/reusable__release__resolve_version.yml@main
    with:
      version_source: 'version_file'
      version_file_path: 'VERSION'

  # ────────────────────────────────────────────────────────────
  # SELFTEST — validate generator before release
  # ────────────────────────────────────────────────────────────
  selftest:
    name: Selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main

      - name: Run selftest (no GUI)
        env:
          RUN_GUI_TESTS: "0"
        run: bash templates/selftest.sh

  # ────────────────────────────────────────────────────────────
  # PUBLISH — bump version, create release, tag and push
  # ────────────────────────────────────────────────────────────
  publish:
    needs: [resolve-version, selftest]
    uses: ai-warevo/.github/.github/workflows/reusable__release__publish.yml@main
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      release_notes: ${{ needs.resolve-version.outputs.release_notes }}
    permissions:
      contents: write
