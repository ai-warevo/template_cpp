# PR Build — fast lint + compile checks on every pull request
#
# Triggers: pull_request and merge_group to main/master
# Calls: reusable-pr-fast.yml from ai-warevo/.github
#
# This workflow runs fast formatting and static analysis checks plus a Debug build
# on a generated CI project, keeping PR feedback time to <5 minutes.

name: PR Build

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fast-checks:
    uses: ai-warevo/.github/.github/workflows/reusable-pr-fast.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      build_type: Debug
      extra_args: -DCI_CHECK_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      extensions: cpp,hpp,c,h
      container_image: ghcr.io/ai-warevo/ci-cpp23
      setup_command: mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project
