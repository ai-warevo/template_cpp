# CI (container) — C++20 Container Workflow
#
# Uses a CI container image (ghcr.io/ai-warevo/ci-cpp23) and composite
# actions from ai-warevo/.github/.github/actions/.
#
# To override container image: fork this file and replace the image value
# (GitHub Actions does not support env.* in container.image context).
#
# Linux-jobs: selftest + lint (clang-format + clang-tidy)
# MSVC-jobs: build + test on native windows-latest
#
# selftest runs separately on ubuntu-latest (shellcheck).

name: CI (container)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # SELFTEST — verify all templates
  # ────────────────────────────────────────────────────────────
  selftest:
    name: Selftest (all templates)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - uses: actions/checkout@main

      - name: Verify toolchain
        run: |
          echo "=== g++ ===" && g++ --version | head -1
          echo "=== clang++-18 ===" && clang++-18 --version | head -1
          echo "=== cmake ===" && cmake --version | head -1
          echo "=== ninja ===" && ninja --version
          echo "=== clang-tidy ===" && clang-tidy --version | head -1
          echo "=== clang-format ===" && clang-format --version | head -1
          echo "=== gcovr ===" && gcovr --version

      - name: Selftest
        run: bash templates/selftest.sh

  # ────────────────────────────────────────────────────────────
  # LINT — clang-format + clang-tidy (Linux, container)
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint (clang-tidy + clang-format)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - uses: actions/checkout@main

      - name: Scaffold template for linting
        run: |
          bash templates/scaffold.sh init static --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      # Setup toolchain (container mode — no-op installer)
      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true

      # Build with compile_commands.json for clang-tidy
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          parallel: false

      - name: clang-format check
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp
          exclude: _deps,CMakeFiles,cmake

      - name: clang-tidy
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          header_filter: '.*'
          exclude: _deps,CMakeFiles,cmake

  # ────────────────────────────────────────────────────────────
  # BUILD-TEST — MSVC (Windows, native runner)
  # ────────────────────────────────────────────────────────────
  build-test-windows:
    name: Build & Test Windows (MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@main

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Scaffold template for MSVC
        shell: bash
        run: |
          bash templates/scaffold.sh init static --name ci_check --ns aw::ci
          bash templates/scaffold.sh eject

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: "${{ steps.tc.outputs.cmake_args }}"

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true
